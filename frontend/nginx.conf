# F-42: per-IP request throttle for the API path. 10 r/s steady with a burst
# of 20 absorbs legitimate UI bursts (parallel loads on Home) while blocking
# request floods. Applies to nginx-fronted deploys (docker compose) only --
# the Render backend has no nginx tier; its guard remains the daily LLM caps.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# F-17: asset Cache-Control, declared here so the add_header can live in the
# server block. Putting it in `location /assets/` instead would silently drop
# every server-block security header for asset responses (see the note there).
# nginx skips an add_header whose value is empty, so non-asset paths are
# untouched.
map $uri $asset_cache {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "";
}

server {
    server_tokens off;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # F-62: connect-src is 'self' + supabase. nginx-served builds MUST use a
    # relative VITE_API_BASE_URL (/api). An absolute API origin baked at build
    # time would be blocked by this CSP -- add it to connect-src if you ever
    # need one.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://*.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # F-17: empty on every non-asset path, so nginx skips it there.
    add_header Cache-Control $asset_cache always;

    # Non-privileged port: the container runs as the unprivileged nginx user,
    # which cannot bind ports below 1024. Host-side 80 maps to this in compose.
    listen 8080;
    server_name _;

    # SPA root.
    root /usr/share/nginx/html;
    index index.html;

    # gzip text assets.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Reverse-proxy API to the backend service. Single-origin keeps CORS out
    # of the picture when serving the SPA behind ngrok.
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 25m;
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        # Explicit upstream host (= backend:8000) rather than the attacker-
        # controllable client Host header. Backend builds no URLs from Host.
        proxy_set_header   Host              $proxy_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /health {
        proxy_pass         http://backend:8000/health;
        proxy_http_version 1.1;
    }

    # Long-cache static asset bundles (they're content-hashed by Vite, so a
    # changed file always has a changed URL). Cache-Control comes from the
    # server-block `add_header Cache-Control $asset_cache` above, not from an
    # `expires` or `add_header` here: any add_header in a location block
    # silently drops every server-block add_header directive, which would
    # strip the security headers from asset responses.
    location /assets/ {
        try_files $uri =404;
    }

    # SPA fallback for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
