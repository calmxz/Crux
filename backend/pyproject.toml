[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crux-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1,<0.141.2",  # MAL-2026-4750: 0.136.3 flagged malicious by pip-audit (amazon-inspector)
    "uvicorn[standard]>=0.52.4,<1.0",
    "sqlalchemy>=2.0.52,<3.0",
    "pydantic>=2.13.5,<3.0",
    "pydantic-settings>=2.15.0",
    "litellm>=1.100.1,<2.0",
    # litellm.completion() imports litellm.proxy.* -> orjson whenever `tools` is
    # passed, but only declares orjson under its [proxy] extra. Every tutor turn
    # passes tools, so without this the live chat path dies with
    # ModuleNotFoundError while the stubbed suite stays green. See tests/test_llm_deps.py.
    "orjson>=3.12.0,<4.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.18,<1.0",
    "pypdf>=6.18.1,<7.0",
    "python-pptx>=1.0.2",
    "tiktoken>=0.14.0,<1.0",
    "snowballstemmer>=3.1.0,<4.0",
    "psycopg[binary]>=3.3.5,<4.0",
    "pgvector>=0.5.0,<1.0",
    "alembic>=1.19.1,<2.0",
    "pyjwt[crypto]>=2.13.0,<3.0",
    "httpx>=0.28.1,<1.0",
    "boto3>=1.43.93,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "httpx>=0.28.1",
    "pytest-cov>=7.1.0",
    "datamodel-code-generator>=0.80.0,<0.81",
    "openapi-spec-validator>=0.9.0",
    "pyyaml>=6.0.3",
    "ruff>=0.14,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=services --cov=lib --cov=worker --cov=routes --cov=agent --cov=db --cov-report=term-missing --cov-fail-under=75"

[tool.coverage.run]
omit = ["tests/*", "scripts/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["contracts/models.py"]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"db/alembic/env.py" = ["E402"]
"db/alembic/versions/*.py" = ["E402"]
"tests/*" = ["E402"]
