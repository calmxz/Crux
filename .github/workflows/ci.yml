name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: crux
          POSTGRES_PASSWORD: crux
          POSTGRES_DB: crux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crux -d crux_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e .[dev]

      - name: Lint (ruff)
        run: ruff check .

      - name: Validate OpenAPI spec
        working-directory: .
        run: python -m openapi_spec_validator docs/api/openapi.yaml

      - name: Verify generated contracts match openapi.yaml
        working-directory: .
        run: |
          python backend/scripts/gen_contracts.py
          git diff --exit-code backend/contracts/
          # Catch untracked new files codegen may emit
          test -z "$(git status --porcelain backend/contracts/)"

      - name: Migrate test Postgres (alembic upgrade head)
        env:
          DATABASE_URL: postgresql://crux:crux@localhost:5432/crux_test
          CRUX_SKIP_DOTENV: "1"
        run: alembic upgrade head

      - name: Test
        env:
          # Only the pgvector integration module reads this; everything else
          # stays on SQLite so the suite is unchanged apart from un-skipping it.
          TEST_DATABASE_URL: postgresql://crux:crux@localhost:5432/crux_test
        run: pytest -v --cov-report=xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend:
    name: Frontend (Vitest + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests + coverage
        run: npm run test:unit:coverage

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          directory: frontend/coverage
          flags: frontend
          fail_ci_if_error: false

      - name: Build
        run: npm run build

  security:
    name: Security (SAST + deps + secrets + images)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks needs full history

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: pip-audit (backend deps)
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266  # v1.1.0
        with:
          inputs: backend/

      - name: npm install (frontend, for audit)
        working-directory: frontend
        run: npm ci

      - name: npm audit (frontend, prod deps, high+)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: gitleaks (secret scan, full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: hadolint (backend Dockerfile)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: warning

      - name: hadolint (frontend Dockerfile)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: warning

      - name: Install bandit + semgrep
        run: pip install bandit semgrep

      - name: bandit (backend SAST, high sev + high conf only)
        run: bandit -r backend -lll -iii -x backend/tests,backend/scripts

      - name: semgrep (OWASP top-10 + audit rulesets)
        run: semgrep ci --config p/owasp-top-ten --config p/security-audit
        env:
          SEMGREP_RULES: "p/owasp-top-ten p/security-audit"

      - name: Build backend image (for trivy)
        run: docker build -t crux-backend:ci backend

      - name: Build frontend image (for trivy)
        run: docker build -t crux-frontend:ci frontend

      - name: trivy (backend image, CRITICAL only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: crux-backend:ci
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      - name: trivy (frontend image, CRITICAL only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: crux-frontend:ci
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
