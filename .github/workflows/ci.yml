name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: crux
          POSTGRES_PASSWORD: crux
          POSTGRES_DB: crux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crux -d crux_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: backend/.python-version

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: '0.13.1'  # lockstep: backend/Dockerfile uv image
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # #609: the committed lock, never a fresh resolve. --locked also fails
      # when uv.lock has drifted from pyproject.toml.
      - name: Install
        run: |
          uv sync --locked --extra dev
          echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      # #616: fails on any error outside .basedpyright/baseline.json (exit 1)
      # and on a fixed error the baseline still lists (exit 3). The flag is
      # explicit so the gate does not depend on basedpyright's CI detection.
      - name: Typecheck (basedpyright)
        run: basedpyright --baselinemode=lock

      - name: Validate OpenAPI spec
        working-directory: .
        run: python -m openapi_spec_validator docs/api/openapi.yaml

      - name: Verify generated contracts match openapi.yaml
        working-directory: .
        run: |
          python backend/scripts/gen_contracts.py
          git diff --exit-code backend/contracts/
          # Catch untracked new files codegen may emit
          test -z "$(git status --porcelain backend/contracts/)"

      - name: Migrate test Postgres (alembic upgrade head)
        env:
          DATABASE_URL: postgresql://crux:crux@localhost:5432/crux_test
          CRUX_SKIP_DOTENV: "1"
        run: alembic upgrade head

      - name: Test
        env:
          # Only the opt-in Postgres modules (tests/*_pg.py and
          # test_pgvector_retrieval.py) read this; everything else stays on
          # SQLite so the suite is unchanged apart from un-skipping them.
          TEST_DATABASE_URL: postgresql://crux:crux@localhost:5432/crux_test
        run: pytest -v --cov-report=xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend:
    name: Frontend (Vitest + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests + coverage
        run: npm run test:unit:coverage

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          directory: frontend/coverage
          flags: frontend
          fail_ci_if_error: false

      - name: Build
        run: npm run build

  # #453: the card refactor's safety net (#454-#458) as a required check. The
  # advisory e2e job also runs this spec, but cannot block a merge. The spec is
  # offline (GoTrue and /api stubbed), so it needs only the Vite dev server that
  # playwright.config.js starts: no backend, no Postgres.
  card-look:
    name: Card look (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Card look spec
        run: npx playwright test e2e/card-look.spec.js

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: card-look-report
          path: frontend/playwright-report/
          retention-days: 7

  security:
    name: Security (SAST + deps + secrets + images)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks needs full history

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: backend/.python-version

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: '0.13.1'  # lockstep: backend/Dockerfile uv image

      # #609: audit what ships, the locked set, not a fresh resolve of the
      # pyproject ranges. Hashes make pip-audit take the pins as-is.
      - name: Export locked backend deps
        run: >-
          uv export --directory backend --locked --all-extras --no-emit-project
          --format requirements-txt -o "$RUNNER_TEMP/backend-requirements.txt"

      - name: pip-audit (backend deps, locked)
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266  # v1.1.0
        with:
          inputs: ${{ runner.temp }}/backend-requirements.txt
          require-hashes: true

      - name: npm install (frontend, for audit)
        working-directory: frontend
        run: npm ci

      - name: npm audit (frontend, prod deps, high+)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: gitleaks (secret scan, full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: hadolint (backend Dockerfile)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: warning

      - name: hadolint (frontend Dockerfile)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: warning

      - name: Install bandit + semgrep
        run: |
          uv tool install bandit
          uv tool install semgrep
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: bandit (backend SAST, high sev + high conf only)
        run: bandit -r backend -lll -iii -x backend/tests,backend/scripts

      - name: semgrep (OWASP top-10 + audit rulesets)
        run: semgrep ci --config p/owasp-top-ten --config p/security-audit
        env:
          SEMGREP_RULES: "p/owasp-top-ten p/security-audit"

      - name: Build backend image (for trivy)
        run: docker build -t crux-backend:ci backend

      - name: Build frontend image (for trivy)
        run: docker build -t crux-frontend:ci frontend

      - name: trivy (backend image, CRITICAL only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: crux-backend:ci
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      - name: trivy (frontend image, CRITICAL only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: crux-frontend:ci
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
