name: db-backup

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  # G-10: the failure alert opens/comments on an issue via the gh CLI.
  issues: write

jobs:
  backup:
    runs-on: ubuntu-latest
    # G-10: a hung pg_dump or R2 upload would otherwise burn the 6h runner
    # limit and overlap the next night's run.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install postgresql-client-17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install boto3
        run: pip install "boto3>=1.35,<2.0"

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Absolute path: the runner preinstalls postgresql-client-16 and its
        # /usr/bin/pg_dump wins the PATH race over the pgdg 17 client,
        # aborting on "server version mismatch" against Postgres 17.
        run: /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" -Fc -f dump.pgc

      - name: Upload and prune
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python -m scripts.backup upload dump.pgc
          python -m scripts.backup prune --keep 7

      # G-10: a scheduled workflow that fails silently is indistinguishable
      # from a working one until a restore is needed. Uses the preinstalled
      # gh CLI -- no third-party action to SHA-pin.
      # cancelled() too: a job killed by timeout-minutes is marked cancelled,
      # not failed, and that hang is exactly the case the timeout guards.
      - name: Alert on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create backup-failure \
            --color B60205 \
            --description "Automated nightly database backup failed" \
            || true
          existing=$(gh issue list --label backup-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          today=$(date -u +%Y-%m-%d)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" \
              --body "db-backup failed again on $today (UTC). Run: $RUN_URL"
          else
            gh issue create \
              --title "db-backup failed $today" \
              --label backup-failure \
              --body "The scheduled database backup job failed. Run: $RUN_URL"
          fi
