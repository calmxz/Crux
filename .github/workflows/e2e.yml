name: E2E

on:
  # No paths filter, so e2e runs on every PR. It is advisory: not a required
  # branch-protection check on dev or main (docs/decisions.md). If it is ever
  # made required, keep it unfiltered: a PR skipped by a paths filter would
  # leave the check stuck at "Expected - Waiting for status" forever.
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  playwright:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Same database as production, and the same service ci.yml runs for its
    # Postgres-only tests: SQLite cannot run pgvector's `<=>` operator, and its
    # transaction semantics differ from Postgres.
    env:
      DATABASE_URL: postgresql://crux:crux@localhost:5432/crux_e2e
      CRUX_SKIP_DOTENV: "1"
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: crux
          POSTGRES_PASSWORD: crux
          POSTGRES_DB: crux_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crux -d crux_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e .[dev]

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: frontend
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Migrate e2e Postgres (alembic upgrade head)
        working-directory: backend
        run: alembic upgrade head

      # #518: no real Supabase in CI. A throwaway key pair stands in for it:
      # the backend verifies tokens against this JWKS through its normal path,
      # and e2e/support/auth.js signs test users' tokens with the private half.
      # Only jwks/ is served; the private key stays on disk.
      - name: Serve e2e JWKS
        working-directory: frontend
        run: |
          node e2e/support/gen-auth-keys.js
          nohup python -m http.server 8787 --bind 127.0.0.1 \
            --directory e2e/.auth/jwks > jwks.log 2>&1 &
          for i in $(seq 1 10); do
            if curl -sf http://127.0.0.1:8787/jwks.json > /dev/null; then
              echo "jwks ready"; exit 0
            fi
            sleep 1
          done
          echo "jwks server failed to start"; cat jwks.log; exit 1

      - name: Start backend (stubbed LLM)
        working-directory: backend
        env:
          LLM_STUB: '1'
          # Fake issuer origin; must match ISSUER_ORIGIN in e2e/support/auth-keys.js.
          # Nothing else switches on from SUPABASE_URL alone: the admin client
          # also needs SUPABASE_SECRET_KEY, which stays unset.
          SUPABASE_URL: 'http://e2e-auth.invalid'
          SUPABASE_JWKS_URL_OVERRIDE: 'http://127.0.0.1:8787/jwks.json'
        run: |
          nohup python -m uvicorn main:app --port 8000 --host 127.0.0.1 \
            > backend.log 2>&1 &
          for i in $(seq 1 30); do
            # /ready probes the database; /health is liveness only.
            if curl -sf http://127.0.0.1:8000/ready > /dev/null; then
              echo "backend ready"; exit 0
            fi
            sleep 1
          done
          echo "backend failed to start"; cat backend.log; exit 1

      - name: Run Playwright
        working-directory: frontend
        env:
          VITE_API_BASE_URL: 'http://localhost:8000/api'
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: backend-log
          path: |
            backend/backend.log
            frontend/jwks.log
          retention-days: 7
