version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"

  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # primevue 5.x is the PrimeUI relicense: requires a configured license
    # key (Community or Commercial) and renders an "Invalid PrimeUI License"
    # watermark without one. Stay on MIT 4.x; revisit deliberately.
    # @primeuix/themes 3.x joined the same PrimeUI license (LICENSE.md
    # replaces MIT); themes 3.x also requires @primeuix/styled ^1.0.0 while
    # primevue 4.5.5 pins ^0.7.4. primeicons was removed (unused; PrimeVue 4
    # uses its own SVG icon components), so it is no longer tracked here.
    # eslint-plugin-oxlint pins its peer to the matching oxlint minor
    # (oxlint@~X.Y.0); a solo oxlint bump fails npm ci with ERESOLVE.
    # @oxlint/plugins is exact-pinned to the oxlint version for the vendored
    # anti-slop plugin (frontend/.oxlint/anti-slop), so it moves with them.
    # @vitest/coverage-v8 peer-requires the exact same vitest version, so a
    # solo bump of either fails npm ci the same way (#315).
    # @vitest/eslint-plugin versions independently and stays out of the group.
    groups:
      oxlint:
        patterns:
          - "oxlint"
          - "eslint-plugin-oxlint"
          - "@oxlint/plugins"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/coverage-v8"
    ignore:
      - dependency-name: "primevue"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@primeuix/themes"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "frontend"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # codeql-action init/autobuild/analyze must stay on the same version;
    # separate per-subaction PRs fail the Analyze jobs with a version mismatch.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: "docker"
    directory: "/backend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "docker"
