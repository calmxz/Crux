# Production stack: nginx-served frontend + uvicorn backend.
# Phase 7+: Postgres + pgvector are Supabase-managed (not in compose).
# Run from repo root:
#   docker compose -f docker-compose.prod.yml --env-file .env up --build
# Public URL via:
#   ngrok http 80      (any --domain flag is fine for stable URLs)

services:
  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the Vite bundle at build time. Sourced from root .env.
        VITE_SUPABASE_URL: ${SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
    # Container serves on 8080 (nginx runs unprivileged); expose it on host 80.
    ports:
      - "80:8080"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    expose:
      - "8000"
    environment:
      # I-07: without this the "prod" stack boots env=dev - sqlite guard,
      # SUPABASE_URL boot check, and prod logging behavior all inert.
      ENV: prod
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MODEL: ${MODEL:-gemini/gemini-3.8-flash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini/gemini-embedding-2}
      DAILY_CAP: ${DAILY_CAP:-50}
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      LLM_SOFT_CAP_USD: ${LLM_SOFT_CAP_USD:-2.00}
      LLM_HARD_CAP_USD: ${LLM_HARD_CAP_USD:-3.00}
      UPLOADS_PATH: /data/uploads
      # Same-origin via nginx — no browser-side CORS preflight needed.
      # Keep the localhost dev origin too in case you reverse-proxy directly.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost}
      LLM_STUB: ${LLM_STUB:-0}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
